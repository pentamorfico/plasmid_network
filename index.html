<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/plasmid.svg" id="favicon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plasmid Defense Network</title>
    <script>
      // Animated favicon using Web Worker
      (function() {
        const favicon = document.getElementById('favicon');
        const worker = new Worker('/favicon-worker.js');
        
        worker.postMessage({ type: 'init' });
        
        worker.onmessage = function(e) {
          if (e.data.type === 'updateFavicon') {
            favicon.href = e.data.dataUrl;
          }
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
